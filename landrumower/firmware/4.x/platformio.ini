; Landrumower RPI Pico firmware 4.x
;
;   pico      real hardware
;   pico_sim  Pico with simulated motors and current sensors (bench without mower)
;   native    unit tests on the host:  pio test -e native

[platformio]
default_envs = pico

[env]
test_framework = unity

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags = -Iinclude
; unit tests run on the host only
test_ignore = *

[env:pico_sim]
extends = env:pico
build_flags =
    ${env:pico.build_flags}
    -DSIMULATED_HARDWARE=1

[env:native]
platform = native
build_flags =
    -Iinclude
    -std=gnu++17
    -Wall
    -Wextra
